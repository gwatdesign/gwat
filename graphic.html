<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نمونه‌کار گرافیک · گوات</title>
<link rel="icon" href="assets/img/mark.svg">
<link rel="stylesheet" href="assets/style.css">
<style>
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.filters button{font:inherit;font-size:14px;padding:7px 18px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--ivory);cursor:pointer;transition:all .3s}
.filters button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:700}
.filters button span{font-size:12px;opacity:.7;margin-inline-start:4px}
.masonry{columns:3 280px;column-gap:18px}
.item{break-inside:avoid;margin-bottom:18px;display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:start;font:inherit;cursor:zoom-in;transition:opacity .4s,transform .5s cubic-bezier(.2,.7,.2,1)}
.item.hide{display:none}
.masonry{perspective:1400px}
.item{animation:flipIn 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*90ms + 500ms)}
@keyframes flipIn{from{transform:rotateY(-40deg) rotateX(12deg) translateZ(-160px) translateY(40px)}}
.item .fr{transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),#fff3,transparent 45%);opacity:0;transition:opacity .4s;z-index:2}
.item:hover .glare{opacity:1}
@media (prefers-reduced-motion:reduce){.item{animation:none}}
.item .fr{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.item img{width:100%;height:auto;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.item:hover img{transform:scale(1.04)}
.item .fr::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 60%,#0b0a09cc);opacity:0;transition:opacity .4s}
.item:hover .fr::after{opacity:1}
.item .zoom{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;background:#0b0a09b3;backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--gold-hi);opacity:0;transform:scale(.7);transition:all .4s;z-index:1}
.item:hover .zoom{opacity:1;transform:none}
.item .cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 4px 0}
.item .cap b{font-weight:600;font-size:15px}
.item .cap span{font-size:12.5px;color:var(--mute)}
.badge{position:absolute;top:14px;right:14px;z-index:1;font-size:11.5px;padding:2px 10px;border-radius:999px;background:#0b0a09b3;backdrop-filter:blur(6px);color:var(--gold-hi);border:1px solid var(--line-2)}
.note{font-size:13px;color:var(--mute);margin-top:6px}
</style></head>
<body>
<main data-page="graphic">
  <header class="phead"><div class="wrap">
    <div class="crumbs"><a href="index.html">خانه</a> / نمونه‌کار گرافیک</div>
    <h1>نمونه‌کارهای گرافیک</h1>
    <p>پوستر، استوری، بسته‌بندی و طرح‌های شبکه‌های اجتماعی. روی هر طرح بزنید تا بزرگ شود؛ با کلیدهای جهت یا کشیدن انگشت ورق بزنید.</p>
  </div></header>
  <section class="wrap" style="padding-bottom:60px">
    <div class="filters" role="group" aria-label="دسته‌بندی" id="filters"></div>
    <div class="masonry" id="grid"></div>
    <p class="note">طرح‌هایی که نشان «طرح مفهومی» دارند برای نمایش سبک ساخته شده‌اند و سفارش مشتری نبوده‌اند.</p>
  </section>
</main>
<script src="assets/sig.js"></script>
<script src="assets/gl3d.js"></script>
<script src="assets/app.js"></script>
<script src="assets/fx.js"></script>
<script>
const works=[
 {id:'g1',t:'پوستر برند گوات',c:'برندینگ',m:'هویت شخصی · ۴:۵'},
 {id:'g2',t:'استوری یاسین دبی',c:'استوری',m:'Yasin automedia · ۹:۱۶'},
 {id:'g3',t:'پوستر شب یلدا',c:'پوستر',m:'مناسبتی · ۴:۵',k:1},
 {id:'g8',t:'استوری معرفی طوطیا',c:'استوری',m:'معرفی اپ · ۹:۱۶'},
 {id:'g4',t:'پوستر نوروز ۱۴۰۶',c:'پوستر',m:'مناسبتی · ۴:۵',k:1},
 {id:'g7',t:'کاروسل «۵ اشتباه رایج»',c:'شبکه‌ی اجتماعی',m:'اینستاگرام · ۴:۵'},
 {id:'g5',t:'بسته‌بندی قهوه‌ی کویر',c:'برندینگ',m:'لیبل و بسته‌بندی',k:1},
 {id:'g6',t:'کاور آلبوم شب‌های تهران',c:'پوستر',m:'کاور موسیقی · ۱:۱',k:1}];
const cats=['همه',...new Set(works.map(w=>w.c))];
const grid=document.getElementById('grid'),fil=document.getElementById('filters');
let curCat='همه';const cache={};const opener=()=>cache[curCat]||(cache[curCat]=lightbox(works.filter(w=>curCat==='همه'||w.c===curCat).map(w=>({src:`assets/img/${w.id}.jpg`,title:w.t,meta:w.m}))));
works.forEach((w,i)=>{grid.insertAdjacentHTML('beforeend',`<button class="item rv" type="button" id="${w.id}" data-c="${w.c}" aria-label="نمایش بزرگ: ${w.t}"><div class="fr">${w.k?'<span class="badge">طرح مفهومی</span>':''}<span class="zoom" aria-hidden="true">⤢</span><img src="assets/img/${w.id}.jpg" alt="${w.t}" loading="lazy"></div><div class="cap"><b>${w.t}</b><span>${w.c}</span></div></button>`)});
grid.querySelectorAll('.item').forEach(b=>b.onclick=()=>{const vis=[...grid.querySelectorAll('.item:not(.hide)')];opener()(vis.indexOf(b))});
cats.forEach((c,i)=>{const n=c==='همه'?works.length:works.filter(w=>w.c===c).length;fil.insertAdjacentHTML('beforeend',`<button type="button" aria-pressed="${i===0}">${c}<span>${fa(n)}</span></button>`)});
fil.querySelectorAll('button').forEach(b=>b.onclick=()=>{fil.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));const c=b.firstChild.textContent;curCat=c;grid.querySelectorAll('.item').forEach(it=>it.classList.toggle('hide',c!=='همه'&&it.dataset.c!==c))});
document.querySelectorAll('.rv').forEach(e=>e.classList.add('in'));
/* 3D: staggered flip-in, tilt + glare per card */
const fine=matchMedia('(hover:hover) and (pointer:fine)').matches,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
grid.querySelectorAll('.item').forEach((it,i)=>{it.style.setProperty('--i',i);const fr=it.querySelector('.fr');fr.insertAdjacentHTML('beforeend','<span class="glare" aria-hidden="true"></span>');
  if(fine&&!reduce){it.addEventListener('pointermove',e=>{const r=fr.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;fr.style.transform=`perspective(900px) rotateY(${x*14}deg) rotateX(${-y*12}deg) scale(1.03)`;fr.style.setProperty('--gx',(x+.5)*100+'%');fr.style.setProperty('--gy',(y+.5)*100+'%')});
  it.addEventListener('pointerleave',()=>{fr.style.transform=''})}});
const h=location.hash.slice(1);if(h&&document.getElementById(h)){setTimeout(()=>{document.getElementById(h).scrollIntoView({block:'center'});document.getElementById(h).click()},700)}
</script>
</body></html>
