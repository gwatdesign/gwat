<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خانه‌مند · فروشگاه لوازم خانگی (نمونه‌کار مفهومی)</title>
<meta name="description" content="نمونه‌کار مفهومی فروشگاه لوازم خانگی چندبرندی با فیلتر، مقایسه، راهنمای خرید و نسخه موبایل — طراحی: گوات">
<style>
@font-face{font-family:P;src:url(fonts/Paykan-800.woff2) format('woff2');font-display:swap}
@font-face{font-family:Y;src:url(fonts/Peyda-500.woff2) format('woff2');font-display:swap}
@font-face{font-family:Y;src:url(fonts/Peyda-700.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--page:#e6e6e4;--frame:#f3f3f2;--card:#fff;--soft:#f4f4f3;--ink:#121212;--mut:#8b8b88;--line:#e7e7e5;--acc:#121212;--accInk:#fff;--hl:#c9a45c;--good:#1f9d63;--bad:#d9534f;--sh:0 1px 0 #0000000a,0 10px 30px -18px #0003;--r:28px}
[data-theme=dark]{--page:#060504;--frame:#0b0a09;--card:#15130f;--soft:#1b1914;--ink:#efe8da;--mut:#9c9486;--line:#c9a45c22;--acc:#c9a45c;--accInk:#0b0a09;--sh:0 1px 0 #ffffff05,0 14px 34px -18px #000}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:500 15px/1.75 Y,system-ui,sans-serif;background:var(--page);color:var(--ink);transition:background .4s,color .4s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
img,svg{display:block}
.h{font-family:P;font-weight:400;letter-spacing:0;line-height:1.35}
.wrap{max-width:1320px;margin:18px auto;background:var(--frame);border-radius:36px;padding:22px;min-height:calc(100vh - 36px);transition:background .4s}
.pill{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 20px;border-radius:99px;background:var(--card);box-shadow:var(--sh);white-space:nowrap;transition:transform .2s,background .3s}
.pill:hover{transform:translateY(-1px)}
.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--sh);position:relative;flex:none}
.ic svg{width:20px;height:20px}
.badge{position:absolute;top:-3px;left:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--hl);color:#111;font:700 11px/19px Y;text-align:center}
.btn{height:46px;padding:0 22px;border-radius:99px;background:var(--acc);color:var(--accInk);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-1px)}.btn.ghost{background:var(--soft);color:var(--ink)}
.arrow{width:46px;height:46px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;flex:none}
.arrow svg{width:18px;height:18px}
.tag{display:inline-flex;height:30px;align-items:center;padding:0 14px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;background:var(--card)}
.mut{color:var(--mut)}
/* header */
.top{display:flex;gap:10px;align-items:center}
.logo{gap:10px;font-weight:700}
.logo i{width:26px;height:26px;border-radius:9px;background:var(--acc);display:grid;place-items:center;color:var(--accInk);font:400 15px P;font-style:normal}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;height:46px;border:0;border-radius:99px;background:var(--card);box-shadow:var(--sh);padding:0 20px 0 56px;outline:none}
.search .go{position:absolute;left:5px;top:5px;width:36px;height:36px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center}
.search .go svg{width:16px}
.sugg{position:absolute;top:54px;right:0;left:0;background:var(--card);border-radius:22px;box-shadow:0 20px 50px -10px #0003;padding:8px;z-index:30;display:none}
.sugg.on{display:block;animation:pop .25s}
.sugg a{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px}
.sugg a:hover,.sugg a.k{background:var(--soft)}
.sugg .th{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center}
.sugg .th svg{height:36px;width:auto}
.sp{flex:1}
.cats{display:flex;gap:10px;margin:14px 0 18px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .pill{flex:1;justify-content:center;min-width:max-content}
.cats .pill.on{background:var(--acc);color:var(--accInk)}
/* bento */
.bento{display:grid;grid-template-columns:1fr 1.25fr .95fr;grid-template-rows:auto auto;gap:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);position:relative;overflow:hidden;transition:background .4s}
.deal{grid-row:span 2;background:linear-gradient(180deg,#dcdcda,#cfcfcc);padding:22px;display:flex;flex-direction:column;min-height:560px}
[data-theme=dark] .deal{background:linear-gradient(180deg,#1d1a15,#100e0b)}
.deal .h{font-size:34px;color:var(--ink)}
[data-theme=dark] .deal .h{color:var(--ink)}
.glass{background:#ffffff55;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #ffffff80;border-radius:26px}
[data-theme=dark] .glass{background:#ffffff0d;border-color:#c9a45c33}
.dealbox{margin:18px auto 0;width:min(100%,300px);padding:18px;flex:1;display:flex;flex-direction:column}
.dealbox .art{flex:1;display:grid;place-items:center;min-height:240px}
.dealbox .art svg{max-height:250px;width:auto;filter:drop-shadow(0 24px 22px #0003);transition:transform .5s}
.rate{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px}
.rate b{color:#f2b01e}
.slidebar{margin-top:16px;display:flex;align-items:center;gap:8px;padding:6px;border-radius:99px}
.slidebar span{flex:1;text-align:center;font-size:14px}
.slidebar .ic{width:40px;height:40px}
.hero{padding:26px;min-height:340px;background:linear-gradient(160deg,#eeeeec,#dddcd9)}
[data-theme=dark] .hero{background:radial-gradient(500px 300px at 30% 0,#c9a45c26,transparent),linear-gradient(160deg,#1b1813,#0f0d0a)}
.hero .h{font-size:34px;color:var(--ink);position:relative;z-index:2}
[data-theme=dark] .hero .h{color:var(--ink)}
.hero p{position:relative;z-index:2;color:var(--mut);font-size:14px;max-width:46%}
[data-theme=dark] .hero p{color:var(--mut)}
.hero .art{position:absolute;left:5%;bottom:-6px;height:94%}
.hero .art svg{height:100%;width:auto;filter:drop-shadow(-20px 30px 30px #0003)}
.hero .tag{position:absolute;right:22px;bottom:22px;height:44px;padding:0 16px;gap:6px;z-index:2}
.side{display:grid;gap:14px;grid-row:span 2}
.mini{padding:18px}
.mini .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.mini .ic{box-shadow:none;background:var(--soft)}
.mini p{margin-top:10px;font-size:14px;color:var(--mut)}
.mini p b{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips span{font-size:12.5px;padding:4px 12px;border-radius:99px;background:var(--soft)}
.news{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.news input{height:40px;border-radius:99px;border:1px solid var(--line);padding:0 16px;background:var(--card);outline:none}
.news .btn{height:40px}
.excl{display:flex;gap:16px;padding:16px;align-items:stretch;min-height:206px}
.excl .tx{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px}
.excl .tx .h{font-size:22px}
.excl .pic{width:52%;border-radius:22px;background:linear-gradient(160deg,#ececea,#d9d8d4);position:relative;display:grid;place-items:center;overflow:hidden}
[data-theme=dark] .excl .pic{background:linear-gradient(160deg,#211d17,#14120e)}
.excl .pic svg{width:86%;filter:drop-shadow(0 16px 16px #0003)}
.excl .open{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:6px;padding:4px 4px 4px 14px;border-radius:99px;background:#ffffffbb;backdrop-filter:blur(10px);color:#111;font-size:14px;flex-direction:row-reverse}
.excl .open .arrow{width:38px;height:38px}
.heart{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;background:#ffffffcc;display:grid;place-items:center;color:#e0455a;z-index:3}
.heart svg{width:17px}
.heart.on svg{fill:currentColor}
/* sections */
.sec{margin-top:34px}
.sec>.hd{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-bottom:14px}
.sec>.hd .h{font-size:28px}
.catgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.catgrid a{padding:16px 10px;text-align:center;border-radius:22px;background:var(--card);box-shadow:var(--sh);transition:transform .25s}
.catgrid a:hover{transform:translateY(-3px)}
.catgrid .th{height:84px;display:grid;place-items:center}
.catgrid .th svg{max-height:80px;width:auto;max-width:90%}
.catgrid b{display:block;margin-top:8px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pc{display:flex;flex-direction:column;padding:14px;border-radius:24px;background:var(--card);box-shadow:var(--sh);position:relative;transition:transform .25s,box-shadow .25s}
.pc:hover{transform:translateY(-3px);box-shadow:0 20px 40px -20px #0004}
.pc .ph{height:200px;border-radius:18px;background:var(--soft);display:grid;place-items:center;position:relative;overflow:hidden}
.pc .ph svg{max-height:170px;max-width:85%;width:auto;filter:drop-shadow(0 14px 14px #0002);transition:transform .4s}
.pc:hover .ph svg{transform:scale(1.05)}
.pc .br{font-size:12.5px;color:var(--mut);margin-top:10px}
.pc .nm{font-weight:700;font-size:15px;line-height:1.6;min-height:48px}
.pc .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin-top:4px}
.pc .pr{margin-top:8px;display:flex;align-items:end;justify-content:space-between;gap:8px}
.pc .pr b{font-size:17px}
.pc .pr s{display:block;font-size:12px;color:var(--mut)}
.pc .off{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font:700 12px/24px Y;padding:0 10px;border-radius:99px;z-index:2}
.cmp{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);cursor:pointer;user-select:none}
.cmp i{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--mut);display:grid;place-items:center;transition:.2s}
.cmp.on i{background:var(--acc);border-color:var(--acc)}
.cmp.on i::after{content:"";width:8px;height:4px;border:2px solid var(--accInk);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.energy{display:inline-flex;align-items:center;font:700 11px/20px Y;color:#fff;padding:0 8px 0 6px;clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);background:#1f9d63;direction:ltr}
.guides{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:14px}
.gd{padding:20px;border-radius:24px;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;min-height:190px;position:relative;overflow:hidden}
.gd .h{font-size:20px}
.gd.big{background:var(--acc);color:var(--accInk)}
.gd.big .mut{color:inherit;opacity:.7}
.gd .ga{position:absolute;left:18px;bottom:-40px;opacity:.95;transform:rotate(-8deg)}
.gd .ga svg{height:150px;width:auto}
.gd.big p,.gd.big .h{max-width:72%}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.trust div{padding:18px;border-radius:22px;background:var(--card);box-shadow:var(--sh);display:flex;gap:12px;align-items:center}
.trust svg{width:30px;flex:none;color:var(--hl)}
.trust b{display:block;font-size:14.5px}.trust span{font-size:12.5px;color:var(--mut)}
/* list */
.lay{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start}
.filters{position:sticky;top:14px;padding:18px;border-radius:24px;background:var(--card);box-shadow:var(--sh)}
.fg{padding:12px 0;border-bottom:1px solid var(--line)}
.fg:last-child{border:0}
.fg h4{font-size:14px;margin-bottom:8px}
.ck{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;cursor:pointer}
.ck input{accent-color:var(--acc);width:17px;height:17px}
.ck small{margin-right:auto;color:var(--mut)}
.range{display:flex;flex-direction:column;gap:6px}
.range input{accent-color:var(--hl);width:100%}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lhead .h{font-size:26px}
.lhead select{height:42px;border-radius:99px;border:0;background:var(--card);box-shadow:var(--sh);padding:0 16px}
.fbtn{display:none}
.empty{padding:60px 20px;text-align:center;border-radius:24px;background:var(--card)}
/* product */
.pd{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.gal{border-radius:30px;background:linear-gradient(160deg,#efefed,#dcdbd7);min-height:560px;display:grid;place-items:center;position:relative;overflow:hidden}
[data-theme=dark] .gal{background:radial-gradient(500px 400px at 50% 30%,#c9a45c1f,transparent),linear-gradient(160deg,#1b1813,#0f0d0a)}
.gal .art{width:100%;display:grid;place-items:center;padding:30px}.gal .art svg{max-height:440px;max-width:80%;width:auto;margin:auto;filter:drop-shadow(0 34px 30px #0003);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.gal .views{position:absolute;bottom:16px;right:50%;transform:translateX(50%);display:flex;gap:8px}
.gal .views button{width:54px;height:54px;border-radius:16px;background:#ffffffaa;display:grid;place-items:center;border:2px solid transparent}
.gal .views button.on{border-color:var(--acc)}
.gal .views svg{height:40px;width:auto}
.info{padding:24px;border-radius:30px;background:var(--card);box-shadow:var(--sh)}
.info .h{font-size:26px;margin:6px 0}
.sw{display:flex;gap:10px;margin:8px 0 4px}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--acc)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.keys div{padding:12px;border-radius:16px;background:var(--soft);font-size:12.5px}
.keys b{display:block;font-size:15px}
.price{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:16px;border-radius:20px;background:var(--soft);margin:12px 0}
.price b{font-size:24px}
.price s{color:var(--mut);font-size:13px;display:block}
.inst{font-size:13px;color:var(--mut)}
.inst b{color:var(--ink)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:150px}
.tabs{display:flex;gap:6px;margin:22px 0 12px;flex-wrap:wrap}
.tabs button{height:40px;padding:0 18px;border-radius:99px;background:var(--card);box-shadow:var(--sh)}
.tabs button.on{background:var(--acc);color:var(--accInk)}
.spec{width:100%;border-collapse:collapse;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--sh)}
.spec td{padding:12px 18px;border-bottom:1px solid var(--line);font-size:14px}
.spec td:first-child{color:var(--mut);width:38%}
.spec tr:last-child td{border:0}
.buybar{display:none}
/* compare */
.ctable{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:var(--sh)}
.ctable th,.ctable td{padding:14px;border-bottom:1px solid var(--line);text-align:center;font-size:14px;vertical-align:middle}
.ctable th:first-child,.ctable td:first-child{text-align:right;color:var(--mut);width:160px;background:var(--soft)}
.ctable .best{color:var(--good);font-weight:700}
.ctable .best::after{content:" ●";font-size:9px;vertical-align:middle}
.ctable tr.same{display:var(--same,table-row)}
.cth svg{height:130px;width:auto;margin:0 auto 8px}
.cwrap{overflow-x:auto;border-radius:24px}
.cbar{position:fixed;bottom:18px;right:50%;transform:translate(50%,150%);background:var(--acc);color:var(--accInk);border-radius:99px;padding:6px 6px 6px 8px;display:flex;align-items:center;gap:10px;z-index:40;transition:transform .45s cubic-bezier(.2,.9,.2,1);box-shadow:0 20px 40px -10px #0006}
.cbar:not(.on){visibility:hidden}.cbar.on{transform:translate(50%,0)}
.cbar .th{width:40px;height:40px;border-radius:50%;background:#ffffff22;display:grid;place-items:center}
.cbar .th svg{height:30px;width:auto}
.cbar .btn{background:var(--accInk);color:var(--acc);height:40px}
/* drawer + modal + toast */
.scrim{position:fixed;inset:0;background:#0006;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;bottom:12px;left:12px;width:min(420px,calc(100% - 24px));background:var(--frame);border-radius:30px;z-index:61;transform:translateX(-110%);transition:transform .45s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;padding:20px}
.drawer.on{transform:none}
.drawer .list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:14px 0}
.ci{display:flex;gap:12px;align-items:center;padding:10px;border-radius:20px;background:var(--card)}
.ci .th{width:64px;height:64px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.ci .th svg{height:52px;width:auto;max-width:56px}
.ci .t{flex:1;font-size:13.5px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--soft)}
.modal{position:fixed;top:50%;right:50%;transform:translate(50%,-46%) scale(.96);width:min(560px,calc(100% - 24px));background:var(--frame);border-radius:30px;z-index:61;padding:26px;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.9,.2,1)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(50%,-50%) scale(1)}
.qopts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}
.qopts button{padding:16px;border-radius:20px;background:var(--card);box-shadow:var(--sh);text-align:right;transition:.2s}
.qopts button:hover{transform:translateY(-2px);box-shadow:0 0 0 2px var(--acc)}
.qopts b{display:block}
.qprog{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.qprog i{display:block;height:100%;background:var(--hl);transition:width .4s}
.toasts{position:fixed;top:18px;right:50%;transform:translateX(50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:99px;background:var(--acc);color:var(--accInk);box-shadow:0 14px 30px -10px #0006;animation:tin .5s cubic-bezier(.2,1.4,.4,1);font-size:14px}
.toast i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--hl);color:#111}
.toast.out{animation:tout .35s forwards}
@keyframes tin{from{transform:translateY(-30px) scale(.8);opacity:0}}
@keyframes tout{to{transform:translateY(-20px);opacity:0}}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.view{animation:vin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}}
.crumb{font-size:13px;color:var(--mut);margin-bottom:12px}
.crumb a:hover{color:var(--ink)}
footer{margin-top:40px;padding:26px;border-radius:28px;background:var(--acc);color:var(--accInk);display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center}
footer .h{font-size:22px}
footer .sig{font-size:13px;opacity:.75}
.concept{font-size:12px;opacity:.7}
.bnav{display:none}

/* ===== loader (coastline-style outline fill) ===== */
#ld{position:fixed;inset:0;z-index:200;background:var(--frame);display:grid;place-items:center;transition:transform .9s cubic-bezier(.8,0,.2,1)}
#ld.done{transform:translateY(-100%)}
.ld-t{position:relative;font:clamp(64px,13vw,150px)/1.3 P;color:transparent;-webkit-text-stroke:1.4px var(--ink)}
.ld-t span{position:absolute;inset:0;color:var(--ink);-webkit-text-stroke:0;clip-path:inset(0 0 0 100%)}
.ld-p{margin-top:10px;text-align:center;font-size:13px;color:var(--mut)}
.ld-p b{color:var(--hl);font-weight:700}
.ld-line{width:min(420px,70vw);height:1px;background:var(--line);margin:18px auto 0;position:relative;overflow:hidden}
.ld-line i{position:absolute;inset:0;background:var(--hl);transform-origin:right;transform:scaleX(0)}
/* ===== showroom stage (record-crate spotlight) ===== */

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

(function(){const ld=$('#ld');let seen=false;try{seen=sessionStorage.getItem('km-ld')}catch(e){}
 if(seen||matchMedia('(prefers-reduced-motion:reduce)').matches){ld.remove();return}
 const t0=performance.now(),D=1500;const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3),v=Math.round(e*100);$('#ldn').textContent=fa(v);$('#ldf').style.clipPath=`inset(0 0 0 ${100-v}%)`;$('#ldl').style.transform=`scaleX(${e})`;
  if(k<1)requestAnimationFrame(step);else{(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ld.classList.add('done');setTimeout(()=>ld.remove(),950);try{sessionStorage.setItem('km-ld',1)}catch(e){}})}};requestAnimationFrame(step)})();
/* ---------- router ---------- */
function route(){CLEAN.forEach(f=>f());CLEAN=[];const h=location.hash.slice(1)||'home';const [v,arg]=h.split('/');let html;
 if(v==='list')html=list((arg||'all').split('?')[0]);else if(v==='p')html=product(arg);else if(v==='compare')html=compare();else if(v==='guide')html=guidePage();else html=home();
 $('#app').innerHTML=`<div class="view">${html}</div>`;
 const cur=v==='list'?(arg||'all').split('?')[0]:v==='p'?(byId(arg)||{}).cat:'';
 $('#cats').innerHTML=`<a class="pill ${v==='list'&&cur==='all'?'on':''}" href="#list/all">همه</a>`+CATS.map(c=>`<a class="pill ${cur===c[0]?'on':''}" href="#list/${c[0]}">${c[1]}</a>`).join('');
 $$('.bnav a').forEach(a=>a.classList.toggle('on',a.dataset.n===(v==='p'?'list':v)||(v==='home'&&a.dataset.n==='home')));
 const bb=$('#buybar');if(v==='p'&&byId(arg)){const p=byId(arg);bb.innerHTML=`<button class="btn" data-add="${p.id}" style="height:42px">افزودن به سبد</button><b>${money(p.price)}</b>`;bb.style.display=''}else bb.style.display='none';
 bind();reveal();updBadges();initStage();initTour();if(!location.hash.includes('?q='))window.scrollTo({top:0,behavior:'instant'})}
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.08});$$('.rv').forEach((el,i)=>{el.style.transitionDelay=(i%4)*60+'ms';io.observe(el)})}
function bind(){
 const keep=f=>()=>{const y=scrollY;f();route();scrollTo(0,y)};$('#dNext')&&($('#dNext').onclick=keep(()=>dealI=(dealI+1)%DEALS.length));$('#dPrev')&&($('#dPrev').onclick=keep(()=>dealI=(dealI-1+DEALS.length)%DEALS.length));
 $('#quiz2')&&($('#quiz2').onclick=quiz);
 $('#news')&&($('#news').onsubmit=e=>{e.preventDefault();toast('عضو خبرنامه شدی؛ اولین تخفیف مال تو!','✉')});
 $$('[data-fb]').forEach(i=>i.onchange=()=>{const b=i.dataset.fb;ST.f.brand=i.checked?[...ST.f.brand,b]:ST.f.brand.filter(x=>x!==b);rerender()});
 $$('[data-fe]').forEach(i=>i.onchange=()=>{ST.f.en=+i.dataset.fe;rerender()});
 $('#finv')&&($('#finv').onchange=e=>{ST.f.inv=e.target.checked?1:0;rerender()});
 $('#fmax')&&($('#fmax').oninput=e=>{$('#fmaxv').textContent='تا '+money(e.target.value)});$('#fmax')&&($('#fmax').onchange=e=>{ST.f.max=+e.target.value;rerender()});
 $('#fsort')&&($('#fsort').onchange=e=>{ST.f.sort=e.target.value;rerender()});
 $('#fclear')&&($('#fclear').onclick=()=>{ST.f={brand:[],en:0,max:0,inv:0,sort:'pop'};rerender();toast('فیلترها پاک شد','↺')});
 $('#fopen')&&($('#fopen').onclick=()=>{$('#filters').classList.add('on');$('#scrim').classList.add('on')});
 $('#fdone')&&($('#fdone').onclick=closeAll);
 $$('[data-col]').forEach(b=>b.onclick=()=>{pcol=b.dataset.col;const p=byId(location.hash.split('/')[1]);$('#part').innerHTML=art(p.type,pcol);$('#pcn').textContent=COL[pcol][2];$$('[data-col]').forEach(x=>x.classList.toggle('on',x===b))});
 $$('[data-tab]').forEach(b=>b.onclick=()=>{ptab=b.dataset.tab;const y=scrollY;route();scrollTo(0,y)});
 $('#odiff')&&($('#odiff').onchange=e=>{onlyDiff=e.target.checked;route()});
}
function rerender(){const open=$('#filters')?.classList.contains('on');const y=scrollY;route();scrollTo(0,y);if(open){$('#filters').classList.add('on')}}
/* ---------- global actions ---------- */
document.addEventListener('click',e=>{const a=e.target.closest('[data-add],[data-cmp],[data-fav]');if(!a)return;e.preventDefault();
 if(a.dataset.add){const id=+a.dataset.add;const it=ST.cart.find(x=>x.id===id);it?it.q++:ST.cart.push({id,q:1});save();updBadges();toast('به سبد خرید اضافه شد','🛒');bump('#cartBtn')}
 else if(a.dataset.cmp){const id=+a.dataset.cmp,p=byId(id);
  if(ST.cmp.includes(id)){ST.cmp=ST.cmp.filter(x=>x!==id);toast('از مقایسه حذف شد','−')}
  else{const c0=ST.cmp.length?byId(ST.cmp[0]).cat:p.cat;if(c0!==p.cat){toast('فقط محصولات هم‌دسته قابل مقایسه‌اند','!');return}if(ST.cmp.length>=3){toast('حداکثر ۳ محصول رو می‌شه مقایسه کرد','!');return}ST.cmp.push(id);toast('به مقایسه اضافه شد','⇄')}
  save();const y=scrollY;route();scrollTo(0,y)}
 else if(a.dataset.fav){const id=+a.dataset.fav;if(ST.fav.includes(id)){ST.fav=ST.fav.filter(x=>x!==id);toast('از علاقه‌مندی‌ها برداشته شد','♡')}else{ST.fav.push(id);toast('به علاقه‌مندی‌ها اضافه شد','❤')}save();a.classList.toggle('on')}});
function bump(s){const el=$(s);el.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:400,easing:'cubic-bezier(.2,1.5,.4,1)'})}
function updBadges(){const n=ST.cart.reduce((a,x)=>a+x.q,0);$$('[data-c=cart]').forEach(b=>{b.hidden=!n;b.textContent=fa(n)});$$('[data-c=cmp]').forEach(b=>{b.hidden=!ST.cmp.length;b.textContent=fa(ST.cmp.length)});
 const cb=$('#cbar');if(ST.cmp.length&&!location.hash.startsWith('#compare')){cb.innerHTML=`${ST.cmp.map(id=>`<span class="th">${art(byId(id).type,byId(id).cols[0])}</span>`).join('')}<span style="font-size:13.5px">${fa(ST.cmp.length)} محصول</span><a class="btn" href="#compare">مقایسه کن</a>`;cb.classList.add('on')}else cb.classList.remove('on')}
/* cart drawer */
function cart(){const items=ST.cart.map(x=>({...byId(x.id),q:x.q}));const sum=items.reduce((a,p)=>a+p.price*p.q,0);
 $('#cart').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div class="h" style="font-size:22px">سبد خرید</div><button class="ic" id="cclose" aria-label="بستن">✕</button></div>
 <div class="list">${items.length?items.map(p=>`<div class="ci"><span class="th">${art(p.type,p.cols[0])}</span><div class="t"><b>${esc(p.name)}</b><div class="mut">${money(p.price)}</div></div><div class="qty"><button data-q="${p.id}" data-d="1">+</button><b>${fa(p.q)}</b><button data-q="${p.id}" data-d="-1">−</button></div></div>`).join(''):'<div class="empty" style="padding:40px 10px"><b>سبدت خالیه</b><p class="mut">یه سر به پیشنهادهای امروز بزن.</p></div>'}</div>
 ${items.length?`<div class="price" style="margin:0 0 10px"><span>جمع کل</span><b>${money(sum)}</b></div><button class="btn" style="width:100%" id="checkout">ادامه‌ی خرید</button>`:''}`;
 $('#cclose').onclick=closeAll;$$('[data-q]').forEach(b=>b.onclick=()=>{const it=ST.cart.find(x=>x.id==b.dataset.q);it.q+=+b.dataset.d;if(it.q<1){ST.cart=ST.cart.filter(x=>x!==it);toast('از سبد حذف شد','🗑')}save();updBadges();cart()});
 $('#checkout')&&($('#checkout').onclick=()=>{toast('این یک نمونه‌کار نمایشیه؛ پرداختی انجام نمی‌شه','ℹ')})}
$('#cartBtn').onclick=()=>{cart();$('#cart').classList.add('on');$('#scrim').classList.add('on')};
function closeAll(){['#cart','#scrim','#modal','#filters'].forEach(s=>$(s)&&$(s).classList.remove('on'))}
$('#scrim').onclick=closeAll;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
/* quiz */
function quiz(){const Q=[['چی لازم داری؟',[['fridge','یخچال','برای آشپزخانه'],['washer','لباسشویی','برای شستشو']]],['چند نفرید؟',[[2,'۱ تا ۲ نفر','آپارتمان کوچک'],[4,'۳ تا ۴ نفر','خانواده معمولی'],[6,'۵ نفر و بیشتر','خانواده پرجمعیت']]],['بودجه‌ت حدوداً چقدره؟',[[80e6,'تا ۸۰ میلیون','اقتصادی'],[150e6,'تا ۱۵۰ میلیون','متوسط'],[1e12,'مهم نیست','بهترین کیفیت']]]];const A=[];
 const step=i=>{if(i===Q.length){const [cat,n,b]=A;const need=cat==='fridge'?(n<=2?20:n<=4?26:30):(n<=2?7:n<=4?9:10);let r=P.filter(p=>p.cat===cat&&p.price<=b).sort((x,y)=>Math.abs(x.s.cap-need)-Math.abs(y.s.cap-need));if(!r.length)r=P.filter(p=>p.cat===cat).sort((x,y)=>x.price-y.price);
   $('#modal').innerHTML=`<div class="qprog"><i style="width:100%"></i></div><div class="h" style="font-size:22px;margin-top:16px">پیشنهاد ما برای شما</div><p class="mut">ظرفیت مناسب: حدود ${fa(need)} ${cat==='fridge'?'فوت':'کیلو'}</p><div style="display:grid;gap:10px;margin-top:12px">${r.slice(0,2).map(p=>`<a class="ci" href="#p/${p.id}" data-close><span class="th">${art(p.type,p.cols[0])}</span><div class="t"><b>${esc(p.name)}</b><div class="mut">${money(p.price)}</div></div><span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span></a>`).join('')}</div><button class="btn ghost" style="width:100%;margin-top:12px" id="qagain">دوباره</button>`;
   $$('[data-close]').forEach(x=>x.onclick=closeAll);$('#qagain').onclick=quiz;toast('بهترین گزینه‌ها پیدا شد','✦');return}
  const [t,o]=Q[i];$('#modal').innerHTML=`<div class="qprog"><i style="width:${(i/Q.length)*100}%"></i></div><div class="mut" style="margin-top:14px;font-size:13px">سؤال ${fa(i+1)} از ${fa(Q.length)}</div><div class="h" style="font-size:22px">${t}</div><div class="qopts">${o.map((x,k)=>`<button data-k="${k}"><b>${x[1]}</b><span class="mut" style="font-size:12.5px">${x[2]}</span></button>`).join('')}</div>`;
  $$('[data-k]').forEach(b=>b.onclick=()=>{A.push(o[b.dataset.k][0]);step(i+1)})};
 step(0);$('#modal').classList.add('on');$('#scrim').classList.add('on')}
$('#quizBtn').onclick=quiz;
/* search */
const qi=$('#q'),sg=$('#sugg');let sk=-1;
qi.oninput=()=>{const v=qi.value.trim();sk=-1;if(!v){sg.classList.remove('on');return}
 const r=P.filter(p=>(p.name+p.brand+catName(p.cat)).includes(v)).slice(0,5);
 sg.innerHTML=r.length?r.map(p=>`<a href="#p/${p.id}"><span class="th">${art(p.type,p.cols[0])}</span><div><b style="font-size:14px">${esc(p.name)}</b><div class="mut" style="font-size:12.5px">${p.brand} · ${money(p.price)}</div></div></a>`).join('')+`<a href="#list/all?q=${encodeURIComponent(v)}" style="justify-content:center;font-size:13px" class="mut">همه‌ی نتایج «${esc(v)}» ←</a>`:`<div class="mut" style="padding:14px;text-align:center">چیزی پیدا نشد؛ «یخچال» یا «ال‌جی» رو امتحان کن</div>`;sg.classList.add('on')};
qi.onkeydown=e=>{const L=$$('#sugg a');if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sk=(sk+(e.key==='ArrowDown'?1:-1)+L.length)%L.length;L.forEach((a,i)=>a.classList.toggle('k',i===sk))}else if(e.key==='Enter'){if(L[sk])location.hash=L[sk].getAttribute('href');else if(qi.value.trim())location.hash='#list/all?q='+encodeURIComponent(qi.value.trim());sg.classList.remove('on');qi.blur()}};
$('#qgo').onclick=()=>{if(qi.value.trim()){location.hash='#list/all?q='+encodeURIComponent(qi.value.trim());sg.classList.remove('on')}};
document.addEventListener('click',e=>{if(!e.target.closest('.search'))sg.classList.remove('on');if(e.target.closest('#sugg a'))sg.classList.remove('on')});
/* theme */
const setTheme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('km-theme',t)}catch(e){}};
try{if(localStorage.getItem('km-theme')==='dark')setTheme('dark')}catch(e){}
$('#theme').onclick=()=>{const d=document.documentElement.dataset.theme==='dark';setTheme(d?'light':'dark');toast(d?'تم روشن':'تم تیره‌ی طلایی',d?'☀':'☾')};
addEventListener('hashchange',()=>{closeAll();pcol=null;route()});route();
</script>
