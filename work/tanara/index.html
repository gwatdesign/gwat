<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تن‌آرا · ورزش و سلامت (نمونه‌کار مفهومی)</title>
<meta name="description" content="نمونه‌کار مفهومی سایت ورزش و سلامت: مربی‌ها، کلینیک تغذیه، برنامه‌ی تمرینی و غذایی آنلاین، دو فروشگاه و پنل مربی و کارمند — طراحی: گوات">
<style>
@font-face{font-family:P;src:url(fonts/Paykan-800.woff2) format('woff2');font-display:swap}
@font-face{font-family:Y;src:url(fonts/Peyda-500.woff2) format('woff2');font-display:swap}
@font-face{font-family:Y;src:url(fonts/Peyda-700.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--bg:#0b0a09;--bg2:#100e0c;--card:#15130f;--soft:#1c1914;--ink:#efe8da;--mut:#a39a8b;--line:#c9a45c26;--g:#c9a45c;--g2:#f1d79a;--g3:#7d6230;--pulse:#ff6a3d;--ok:#4cb050;--r:24px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font:500 15px/1.85 Y,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit;text-decoration:none}svg{display:block}
.h{font-family:P;font-weight:400;line-height:1.4}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.mut{color:var(--mut)}.gold{color:var(--g)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 26px;border-radius:99px;font-weight:700;color:#0b0a09;background:linear-gradient(135deg,var(--g2),var(--g));transition:transform .2s,box-shadow .3s;box-shadow:0 10px 30px -12px #c9a45caa}
.btn:hover{transform:translateY(-2px)}
.btn.gh{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px #c9a45c66}
@property --ga{syntax:'<angle>';inherits:false;initial-value:0deg}
.beam{background:linear-gradient(var(--bg2),var(--bg2)) padding-box,conic-gradient(from var(--ga),#c9a45c22,#f1d79a,#c9a45c22 30%) border-box;border:1.5px solid transparent;color:var(--ink);box-shadow:none;animation:ga 4s linear infinite}
@keyframes ga{to{--ga:360deg}}
.chip{align-self:flex-start;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:99px;font-size:12.5px;border:1px solid var(--line);background:#ffffff06;color:var(--g2)}
.chip svg{width:16px;height:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
/* header */
header{position:sticky;top:0;z-index:40;background:#0b0a09cc;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:22px;height:70px}
.logo{display:flex;align-items:center;gap:10px;font:400 22px P}
.logo i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g2),var(--g3));font-style:normal}
.logo i svg{width:20px;height:20px}
.links{display:flex;gap:4px;margin-right:12px}
.links a{padding:8px 14px;border-radius:99px;font-size:14px;color:var(--mut);transition:.2s}
.links a:hover,.links a.on{color:var(--ink);background:#ffffff0a}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);position:relative}
.ib svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;left:-4px;min-width:20px;height:20px;border-radius:99px;background:var(--g);color:#0b0a09;font:700 11px/20px Y;text-align:center;padding:0 5px}
.hamb{display:none}
/* hero */
.hero{position:relative;padding:64px 0 40px;overflow:hidden}
.hero .grid{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:46px;line-height:1.45}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--g2),var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:18px 0 26px;color:var(--mut);font-size:16px;max-width:520px}
.hero .acts{display:flex;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:28px;margin-top:34px}
.stats b{display:block;font:400 28px P;color:var(--g2)}.stats span{font-size:12.5px;color:var(--mut)}
.viz{position:relative;aspect-ratio:1;max-width:520px;margin-inline:auto;width:100%}
.viz svg.rings{position:absolute;inset:0;width:100%;height:100%}
.ring{fill:none;stroke-linecap:round;transform-origin:50% 50%;transform:rotate(-90deg)}
.pulse{position:absolute;left:-8%;right:-8%;top:44%;height:120px}
.pulse path{fill:none;stroke:var(--pulse);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 8px #ff6a3d99);stroke-dasharray:900;animation:beat 3.2s linear infinite}
@keyframes beat{from{stroke-dashoffset:900}to{stroke-dashoffset:-900}}
.float{position:absolute;padding:12px 16px;border-radius:18px;background:#15130fe6;border:1px solid var(--line);backdrop-filter:blur(10px);font-size:12.5px;box-shadow:0 20px 40px -20px #000;animation:fl 6s ease-in-out infinite}
.float b{display:block;font:400 20px P;color:var(--g2)}
@keyframes fl{50%{transform:translateY(-10px)}}
.glow{position:absolute;inset:-20% -10% auto auto;width:640px;height:640px;background:radial-gradient(closest-side,#c9a45c22,transparent);pointer-events:none}
/* sections */
section.s{padding:64px 0}
.st{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:26px}
.st .h{font-size:32px}.st p{color:var(--mut);max-width:560px;font-size:14.5px}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.svc a{padding:24px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .3s,border-color .3s;min-height:250px}
.svc a:hover{transform:translateY(-4px);border-color:#c9a45c66}
.svc .ic{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#c9a45c33,#c9a45c0d);border:1px solid var(--line)}
.svc .ic svg{width:30px;height:30px;color:var(--g2)}
.svc b{font:400 20px P}.svc p{font-size:13.5px;color:var(--mut)}
.svc .more{margin-top:auto;font-size:13px;color:var(--g)}
.svc a::after{content:"";position:absolute;left:-40px;bottom:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(closest-side,#c9a45c22,transparent)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.steps div{padding:24px;position:relative}
.steps div::before{counter-increment:s;content:"۰" counter(s,persian);font:400 46px P;color:#c9a45c33;position:absolute;left:20px;top:10px}
.steps b{display:block;font:400 19px P;margin-bottom:6px}.steps p{font-size:13.5px;color:var(--mut)}
.coaches{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.co{padding:20px;text-align:center;transition:transform .3s}
.co:hover{transform:translateY(-4px)}
.av{width:96px;height:96px;margin:4px auto 12px;border-radius:50%;display:grid;place-items:center;font:400 30px P;color:#0b0a09;position:relative}
.av small{position:absolute;bottom:-4px;left:-4px;width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.av small svg{width:18px;height:18px;color:var(--g2)}
.co b{display:block;font:400 18px P}.co .r{font-size:12.5px;color:var(--mut)}
.co .tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.co .tags span{font-size:11.5px;padding:2px 10px;border-radius:99px;background:var(--soft)}
.co .btn{height:40px;font-size:13.5px;width:100%}
.filt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.filt button{height:38px;padding:0 16px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;color:var(--mut)}
.filt button.on{background:var(--g);color:#0b0a09;border-color:var(--g);font-weight:700}
.shops{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.shops a{padding:30px;min-height:260px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.shops .h{font-size:26px}.shops p{color:var(--mut);font-size:14px;max-width:300px}
.shops .art{position:absolute;left:24px;bottom:18px;display:flex;gap:10px;opacity:.95}
.shops .art div{width:84px;height:84px;border-radius:20px;background:var(--soft);display:grid;place-items:center;border:1px solid var(--line)}
.shops .art svg{width:46px;height:46px;color:var(--g2)}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.quotes div{padding:22px;font-size:14px}.quotes b{display:block;margin-top:12px;font-size:13px;color:var(--g)}
.cta{padding:44px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(500px 200px at 50% 0,#c9a45c2a,transparent),var(--card)}
.cta .h{font-size:32px}.cta p{color:var(--mut);margin:8px 0 22px}
footer{border-top:1px solid var(--line);padding:30px 0 100px;margin-top:40px;font-size:13px;color:var(--mut)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer b{color:var(--ink)}
/* page head */
.ph{padding:44px 0 18px}.ph .h{font-size:34px}.ph p{color:var(--mut);max-width:620px;margin-top:6px}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:8px}
/* clinic */
.cl{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.cl .card{padding:24px}
.li{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}.li:last-child{border:0}
.li .ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--soft)}
.li .ic svg{width:22px;height:22px;color:var(--g2)}
.li b{display:block}.li p{font-size:13px;color:var(--mut)}
.book{display:grid;gap:10px}
.book label{font-size:13px;color:var(--mut)}
.inp{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);padding:0 14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--g)}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slots button{height:38px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-size:13px}
.slots button.on{background:var(--g);color:#0b0a09;border-color:var(--g)}
/* plan wizard */
.wz{display:grid;grid-template-columns:1fr 1.1fr;gap:16px;align-items:start}
.wz .card{padding:26px}
.prog{height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g3),var(--g2));transition:width .4s}
.q{font:400 22px P;margin-bottom:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:14px;border-radius:16px;border:1px solid var(--line);text-align:right;transition:.2s}
.opts button:hover{border-color:#c9a45c88}
.opts button.on{border-color:var(--g);background:#c9a45c14}
.opts b{display:block}.opts span{font-size:12.5px;color:var(--mut)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.wnav{display:flex;justify-content:space-between;margin-top:20px}
.res .k{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.res .k div{padding:12px;border-radius:16px;background:var(--soft);text-align:center}
.res .k b{display:block;font:400 22px P;color:var(--g2)}.res .k span{font-size:12px;color:var(--mut)}
.bmi{position:relative;height:10px;border-radius:9px;background:linear-gradient(90deg,#5aa0d8,#4cb050 30%,#e8c34a 62%,#e8833a 80%,#d9534f);margin:10px 0 24px}
.bmi i{position:absolute;top:-6px;width:4px;height:22px;border-radius:3px;background:#fff;box-shadow:0 0 0 3px #0b0a09;transition:right .6s}
.mac{display:flex;height:14px;border-radius:9px;overflow:hidden;margin:8px 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.week div{padding:10px 4px;border-radius:12px;background:var(--soft);text-align:center;font-size:11.5px}
.week div b{display:block;font-size:12.5px;color:var(--g2)}
.week div.off{opacity:.45}
.meal{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.note{font-size:12.5px;color:var(--mut);padding:12px 14px;border-radius:14px;background:#c9a45c0f;border:1px solid var(--line);margin-top:14px}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty svg{width:120px;margin:0 auto 10px;color:var(--g)}
/* shop */
.tabs{display:inline-flex;padding:5px;border-radius:99px;border:1px solid var(--line);margin-bottom:16px}
.tabs a{padding:8px 20px;border-radius:99px;font-size:14px;color:var(--mut)}
.tabs a.on{background:var(--g);color:#0b0a09;font-weight:700}
.prods{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pr{padding:14px;display:flex;flex-direction:column;transition:transform .3s}
.pr:hover{transform:translateY(-4px)}
.pr .im{height:170px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(closest-side,#c9a45c22,transparent),var(--soft);position:relative}
.pr .im svg{width:90px;height:90px;color:var(--g2);transition:transform .4s}
.pr:hover .im svg{transform:scale(1.08) rotate(-4deg)}
.pr .off{position:absolute;top:10px;right:10px;font:700 11.5px/24px Y;padding:0 10px;border-radius:99px;background:var(--pulse);color:#fff}
.pr b{margin-top:12px;font-size:14.5px}.pr .d{font-size:12px;color:var(--mut)}
.pr .pp{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.pr .pp b{margin:0;font:400 17px P;color:var(--g2)}
.add{width:40px;height:40px;border-radius:50%;background:var(--g);color:#0b0a09;display:grid;place-items:center}
.add svg{width:18px}
.ship{margin-bottom:16px;padding:12px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.ship .bar{flex:1;height:6px;border-radius:9px;background:var(--soft);overflow:hidden}.ship .bar i{display:block;height:100%;background:var(--g)}
/* panels */
.pn{display:grid;grid-template-columns:230px 1fr;gap:16px;align-items:start}
.side{padding:14px;position:sticky;top:86px}
.side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:14px;color:var(--mut)}
.side a.on,.side a:hover{background:#ffffff0a;color:var(--ink)}
.side .who{display:flex;gap:10px;align-items:center;padding:8px 8px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side .who .av{width:44px;height:44px;margin:0;font-size:16px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi div{padding:18px}.kpi b{display:block;font:400 28px P;color:var(--g2)}.kpi span{font-size:12.5px;color:var(--mut)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-weight:500;color:var(--mut);text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12.5px}
.tbl td{padding:12px;border-bottom:1px dashed var(--line)}
.tbl tr:last-child td{border:0}
.st-ch{display:inline-block;padding:2px 12px;border-radius:99px;font-size:12px}
.st-w{background:#e8c34a22;color:#e8c34a}.st-o{background:#4cb05022;color:#7ed383}.st-s{background:#5aa0d822;color:#8cc3ef}
.mini{height:34px;padding:0 14px;font-size:12.5px}
.box{padding:20px;margin-bottom:16px}.box .h{font-size:18px;margin-bottom:10px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.sch div{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13.5px}.sch div:last-child{border:0}
.sch time{color:var(--g2);font-weight:700;min-width:48px}
.bars{display:flex;align-items:end;gap:8px;height:120px;padding-top:10px}
.bars i{flex:1;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--g),var(--g3));transform-origin:bottom;animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}}
.roles{display:inline-flex;padding:5px;border-radius:99px;border:1px solid var(--line);margin-bottom:16px}
.roles a{padding:7px 18px;border-radius:99px;font-size:13.5px;color:var(--mut)}.roles a.on{background:var(--g);color:#0b0a09;font-weight:700}
/* overlays */
.scrim{position:fixed;inset:0;background:#000a;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{visibility:hidden;position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);background:var(--bg2);border-right:1px solid var(--line);z-index:81;transform:translateX(-100%);transition:transform .45s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;padding:22px}
.drawer.on{transform:none;visibility:visible}
.drawer .list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:16px 0}
.ci{display:flex;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.ci .th{width:54px;height:54px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}.ci .th svg{width:30px;color:var(--g2)}
.ci .t{flex:1;font-size:13px}
.qty{display:flex;gap:6px;align-items:center}.qty button{width:28px;height:28px;border-radius:50%;background:var(--soft)}
.modal{position:fixed;top:50%;right:50%;transform:translate(50%,-46%) scale(.96);width:min(460px,calc(100% - 24px));background:var(--bg2);border:1px solid var(--line);border-radius:28px;z-index:81;padding:26px;opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.9,.2,1)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(50%,-50%) scale(1)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;border-radius:16px;background:var(--card);margin:14px 0}
.seg button{height:38px;border-radius:12px;font-size:13px;color:var(--mut)}.seg button.on{background:var(--g);color:#0b0a09;font-weight:700}
.toasts{position:fixed;top:84px;right:50%;transform:translateX(50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:8px 18px 8px 8px;border-radius:99px;background:var(--card);border:1px solid #c9a45c55;box-shadow:0 14px 30px -10px #000;font-size:14px;animation:tin .5s cubic-bezier(.2,1.4,.4,1)}
.toast i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:linear-gradient(135deg,var(--g2),var(--g));color:#0b0a09}
.toast.out{animation:tout .35s forwards}
@keyframes tin{from{transform:translateY(-24px) scale(.85);opacity:0}}@keyframes tout{to{transform:translateY(-16px);opacity:0}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.view{animation:vin .5s cubic-bezier(.2,.8,.2,1)}@keyframes vin{from{opacity:0;transform:translateY(10px)}}
#ld{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#ld.done{opacity:0;visibility:hidden}
#ld svg{width:120px}#ld path{fill:none;stroke:var(--pulse);stroke-width:3;stroke-dasharray:300;animation:beat 1.4s linear infinite}
#ld b{display:block;text-align:center;font:400 22px P;margin-top:6px}
.bnav{display:none}
.sheet{position:fixed;inset:0;z-index:85;background:var(--bg);padding:24px;transform:translateY(100%);visibility:hidden;transition:transform .45s cubic-bezier(.2,.9,.2,1),visibility .45s;display:flex;flex-direction:column;gap:6px}
.sheet.on{transform:none;visibility:visible}.sheet a{padding:14px 6px;border-bottom:1px solid var(--line);font:400 20px P}
@media (max-width:1050px){.svc,.coaches,.prods{grid-template-columns:repeat(2,1fr)}.kpi{grid-template-columns:repeat(2,1fr)}.links{display:none}.hamb{display:grid}}
@media (max-width:760px){
 body{font-size:14.5px}.wrap{padding:0 16px}.nav{height:62px;gap:10px}.logo{font-size:19px}.nav .gh{display:none}
 .hero{padding:26px 0 10px}.hero .grid{grid-template-columns:1fr;gap:10px}.hero h1{font-size:23px}.hero p{font-size:14.5px;margin:12px 0 18px}
 .viz{order:-1;max-width:330px}.stats{gap:18px;margin-top:22px}.stats b{font-size:22px}
 .float{font-size:11px;padding:8px 10px}.float b{font-size:15px}

/* plan wizard */
let W=ld('ta-w',{step:0,sex:'m',age:28,h:175,w:78,act:1.55,goal:'fit',days:4});let showRes=false;
const ACT=[[1.2,'کم‌تحرک','پشت میز، بدون ورزش'],[1.375,'سبک','۱ تا ۳ روز ورزش'],[1.55,'متوسط','۳ تا ۵ روز ورزش'],[1.725,'زیاد','۶ تا ۷ روز ورزش']];
const GOAL=[['lose','کاهش وزن','چربی‌سوزی با حفظ عضله'],['fit','تناسب اندام','حفظ وزن و آمادگی'],['gain','افزایش عضله','حجم با کیفیت']];
function calc(){const bmr=10*W.w+6.25*W.h-5*W.age+(W.sex==='m'?5:-161);const tdee=bmr*W.act;
 let kcal=W.goal==='lose'?tdee-500:W.goal==='gain'?tdee+300:tdee;kcal=Math.max(kcal,W.sex==='m'?1500:1200);
 const p=Math.round(W.w*(W.goal==='lose'?2:1.8)),f=Math.round(kcal*.25/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
 const bmi=W.w/Math.pow(W.h/100,2);return{bmr,tdee,kcal,p,f,c,bmi}}
const SPL={lose:['کل بدن + کاردیو','کاردیو ۳۰ دقیقه','کل بدن','HIIT ۲۰ دقیقه','کل بدن + کاردیو'],fit:['بالاتنه','پایین‌تنه','کاردیو و هسته','کل بدن','یوگا / کشش'],gain:['سینه و پشت بازو','پشت و جلو بازو','پا','سرشانه و شکم','پا و باسن']};
function plan(){const st=W.step;const tot=5;
 const q=[()=>`<div class="q">جنسیت و سن</div><div class="opts">${[['m','آقا'],['f','خانم']].map(o=>`<button data-k="sex" data-v="${o[0]}" class="${W.sex===o[0]?'on':''}"><b>${o[1]}</b></button>`).join('')}</div><label class="mut" style="display:block;margin-top:14px;font-size:13px">سن: <b id="ageV">${fa(W.age)}</b> سال</label><input type="range" min="15" max="70" value="${W.age}" data-r="age" style="width:100%;accent-color:#c9a45c">`,
  ()=>`<div class="q">قد و وزن</div><label class="mut" style="font-size:13px">قد: <b id="hV">${fa(W.h)}</b> سانتی‌متر</label><input type="range" min="140" max="210" value="${W.h}" data-r="h" style="width:100%;accent-color:#c9a45c"><label class="mut" style="font-size:13px;display:block;margin-top:14px">وزن: <b id="wV">${fa(W.w)}</b> کیلو</label><input type="range" min="40" max="150" value="${W.w}" data-r="w" style="width:100%;accent-color:#c9a45c">`,
  ()=>`<div class="q">چقدر فعالی؟</div><div class="opts">${ACT.map(a=>`<button data-k="act" data-v="${a[0]}" class="${W.act==a[0]?'on':''}"><b>${a[1]}</b><span>${a[2]}</span></button>`).join('')}</div>`,
  ()=>`<div class="q">هدفت چیه؟</div><div class="opts" style="grid-template-columns:1fr">${GOAL.map(g=>`<button data-k="goal" data-v="${g[0]}" class="${W.goal===g[0]?'on':''}"><b>${g[1]}</b><span>${g[2]}</span></button>`).join('')}</div>`,
  ()=>`<div class="q">هفته‌ای چند روز تمرین می‌کنی؟</div><div class="opts" style="grid-template-columns:repeat(3,1fr)">${[3,4,5].map(d=>`<button data-k="days" data-v="${d}" class="${W.days==d?'on':''}"><b>${fa(d)} روز</b></button>`).join('')}</div>`];
 return `<div class="wrap"><div class="ph"><div class="crumb">خانه / برنامه‌ی آنلاین</div><div class="h">برنامه‌ی تمرینی و غذایی شخصی</div><p>چند سؤال ساده جواب بده؛ برنامه‌ات همین‌جا ساخته می‌شه و برای تأیید مربی فرستاده می‌شه.</p></div>
 <div class="wz"><div class="card"><div class="prog"><i style="width:${(st+1)/tot*100}%"></i></div><div class="mut" style="font-size:12.5px;margin-bottom:4px">قدم ${fa(st+1)} از ${fa(tot)}</div>${q[st]()}
  <div class="wnav"><button class="btn gh" id="wPrev" ${st===0?'style="visibility:hidden"':''}>قبلی</button><button class="btn" id="wNext">${st===tot-1?'ساخت برنامه':'بعدی'}</button></div></div>
  <div class="card res" id="res">${showRes?result():`<div class="empty">${ic('plan',1.2)}<b style="color:var(--ink)">برنامه‌ات اینجا ساخته می‌شه</b><p>به سؤال‌ها جواب بده و «ساخت برنامه» رو بزن.</p></div>`}</div></div><div style="height:60px"></div></div>`}
function result(){const r=calc();const g=GOAL.find(x=>x[0]===W.goal)[1];const pos=Math.min(98,Math.max(2,(r.bmi-15)/(40-15)*100));
 const cat=r.bmi<18.5?'کمبود وزن':r.bmi<25?'نرمال':r.bmi<30?'اضافه وزن':'چاقی';
 const days=['ش','ی','د','س','چ','پ','ج'];const on={3:[0,2,4],4:[0,1,3,5],5:[0,1,2,4,5]}[W.days];let j=0;
 const tot=r.p*4+r.f*9+r.c*4;
 return `<div class="h" style="font-size:22px">برنامه‌ی شما · ${g}</div><div class="mut" style="font-size:12.5px">پیش‌نویس خودکار؛ قبل از شروع، مربی تأییدش می‌کنه.</div>
 <div class="k"><div><b>${fa(Math.round(r.kcal).toLocaleString('en-US'))}</b><span>کالری روزانه</span></div><div><b>${fa(r.p)} گرم</b><span>پروتئین</span></div><div><b>${fa(r.c)} گرم</b><span>کربوهیدرات</span></div><div><b>${fa(r.f)} گرم</b><span>چربی</span></div></div>
 <div style="font-size:13px">شاخص توده‌ی بدنی: <b class="gold">${fa(r.bmi.toFixed(1))}</b> · ${cat}</div><div class="bmi"><i style="right:calc(${100-pos}% - 2px)"></i></div>
 <div style="font-size:13px">ترکیب درشت‌مغذی‌ها</div><div class="mac"><i style="width:${r.p*4/tot*100}%;background:#c9a45c"></i><i style="width:${r.c*4/tot*100}%;background:#7ed383"></i><i style="width:${r.f*9/tot*100}%;background:#ff6a3d"></i></div>
 <div style="font-size:13px;margin-top:14px">برنامه‌ی تمرین هفتگی</div><div class="week">${days.map((d,i)=>on.includes(i)?`<div><b>${d}</b>${SPL[W.goal][j++]}</div>`:`<div class="off"><b>${d}</b>استراحت</div>`).join('')}</div>
 <div style="font-size:13px;margin-top:10px">نمونه‌ی یک روز غذایی</div>
 ${[['صبحانه','جو دوسر، شیر کم‌چرب، یک موز',.25],['ناهار','برنج قهوه‌ای، مرغ گریل، سالاد',.35],['میان‌وعده','ماست یونانی و بادام',.12],['شام','ماهی یا تخم‌مرغ، سبزیجات بخارپز',.28]].map(m=>`<div class="meal"><span><b>${m[0]}</b> · ${m[1]}</span><span class="gold">${fa(Math.round(r.kcal*m[2]))} کالری</span></div>`).join('')}
 <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="sendPlan">ارسال برای تأیید مربی</button><button class="btn gh" id="again">ویرایش مشخصات</button></div>
 <div class="note">این برنامه یه پیش‌نویس محاسبه‌شده‌ست و جای نظر پزشک رو نمی‌گیره؛ اگه بیماری یا آسیب خاصی داری، اول با متخصص صحبت کن.</div>`}

 $$('[data-add]').forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.add.split(':');const p=(k==='food'?FOOD:GEAR)[i];const id=k+i;const it=ST.cart.find(x=>x.id===id);it?it.q++:ST.cart.push({id,n:p[0],ic:p[1],p:p[3],q:1});sv('ta-cart',ST.cart);cartBadge();toast('به سبد اضافه شد','🛒');$('#cartBtn').animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:400});rerender(true)});
 $$('[data-ok]').forEach(b=>b.onclick=()=>{const tr=b.closest('tr');tr.style.transition='.4s';tr.style.opacity='0';setTimeout(()=>tr.remove(),400);if(b.closest('tr').innerHTML.includes('شما')){ST.plans=[];sv('ta-plans',[])}toast('برنامه تأیید شد و برای شاگرد ارسال شد','✓')});
 $$('[data-cyc]').forEach(b=>b.onclick=()=>{const s=['در انتظار','ارسال شد','تحویل شد'],c=['st-w','st-s','st-o'];let i=(s.indexOf(b.textContent)+1)%3;b.textContent=s[i];b.className='st-ch '+c[i];toast('وضعیت سفارش به‌روز شد','↻')});
 $('#restock')&&($('#restock').onclick=()=>toast('سفارش خرید برای ۳ کالا ثبت شد','📦'));
}
function rerender(keep){const y=scrollY;route();if(keep!==false)scrollTo(0,y)}
/* cart */
function cartBadge(){const n=ST.cart.reduce((a,x)=>a+x.q,0);$('#cb').hidden=!n;$('#cb').textContent=fa(n)}
function cart(){const sum=ST.cart.reduce((a,x)=>a+x.p*x.q,0);
 $('#drawer').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div class="h" style="font-size:22px">سبد خرید</div><button class="ib" id="dx" aria-label="بستن">✕</button></div>
 <div class="list">${ST.cart.length?ST.cart.map(x=>`<div class="ci"><span class="th">${ic(x.ic,1.3)}</span><div class="t"><b>${x.n}</b><div class="mut">${money(x.p)}</div></div><div class="qty"><button data-q="${x.id}" data-d="1">+</button><b>${fa(x.q)}</b><button data-q="${x.id}" data-d="-1">−</button></div></div>`).join(''):`<div class="empty">${ic('cart',1.2)}سبدت خالیه</div>`}</div>
 ${ST.cart.length?`<div class="card" style="padding:14px;display:flex;justify-content:space-between;margin-bottom:10px"><span>جمع کل</span><b class="gold">${money(sum)}</b></div><button class="btn" style="width:100%" id="pay">ادامه‌ی خرید</button>`:''}`;
 $('#dx').onclick=closeAll;$$('[data-q]').forEach(b=>b.onclick=()=>{const it=ST.cart.find(x=>x.id===b.dataset.q);it.q+=+b.dataset.d;if(it.q<1)ST.cart=ST.cart.filter(x=>x!==it);sv('ta-cart',ST.cart);cartBadge();cart()});
 $('#pay')&&($('#pay').onclick=()=>toast('نمونه‌کار نمایشیه؛ پرداختی انجام نمی‌شه','ℹ'))}
$('#cartBtn').onclick=()=>{cart();$('#drawer').classList.add('on');$('#scrim').classList.add('on')};
/* auth */
let role='user';
function openAuth(msg){const u=ST.user;$('#modal').innerHTML=u?`<div class="h" style="font-size:22px">سلام ${u.name} 👋</div><p class="mut" style="margin:6px 0 16px">وارد شدی به‌عنوان ${({user:'کاربر',coach:'مربی',staff:'کارمند'})[u.role]}.</p><div style="display:flex;gap:10px"><a class="btn" href="${u.role==='user'?'#plan':'#panel/'+u.role}" id="go">${u.role==='user'?'برنامه‌ی من':'رفتن به پنل'}</a><button class="btn gh" id="out">خروج</button></div>`
 :`<div class="h" style="font-size:22px">ورود / ثبت‌نام</div>${msg?`<p class="mut" style="font-size:13px;margin-top:4px">${msg}</p>`:''}<div class="seg">${[['user','کاربر'],['coach','مربی'],['staff','کارمند']].map(r=>`<button data-role="${r[0]}" class="${role===r[0]?'on':''}">${r[1]}</button>`).join('')}</div>
 <div class="book"><label>نام</label><input class="inp" id="aN" placeholder="مثلاً سارا"><label>شماره‌ی موبایل</label><input class="inp" id="aP" inputmode="tel" placeholder="۰۹۱۲…"><button class="btn" id="aGo" style="margin-top:6px">دریافت کد و ورود</button><p class="mut" style="font-size:11.5px;text-align:center">نسخه‌ی نمایشی؛ کدی ارسال نمی‌شه.</p></div>`;
 $('#modal').classList.add('on');$('#scrim').classList.add('on');
 $$('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;$$('[data-role]').forEach(x=>x.classList.toggle('on',x===b))});
 $('#aGo')&&($('#aGo').onclick=()=>{const n=$('#aN').value.trim()||'کاربر';ST.user={name:n,role};sv('ta-user',ST.user);closeAll();toast(`خوش اومدی ${n}!`,'👋');$('#loginBtn').textContent=n;if(role!=='user')location.hash='#panel/'+role});
 $('#out')&&($('#out').onclick=()=>{ST.user=null;sv('ta-user',null);closeAll();$('#loginBtn').textContent='ورود / ثبت‌نام';toast('خارج شدی','↩')});
 $('#go')&&($('#go').onclick=closeAll)}
$('#loginBtn').onclick=()=>openAuth();if(ST.user)$('#loginBtn').textContent=ST.user.name;
$('#hamb').onclick=()=>{$('#sheet').innerHTML=`<button class="ib" style="align-self:flex-end" id="sx">✕</button>`+[...NAV,['#panel/coach','پنل مربی'],['#panel/staff','پنل کارمند'],['#shop/food','فروشگاه غذا و مکمل']].map(n=>`<a href="${n[0]}">${n[1]}</a>`).join('');$('#sheet').classList.add('on');$('#sx').onclick=closeAll};
addEventListener('hashchange',()=>{closeAll();route()});
route();setTimeout(()=>$('#ld').classList.add('done'),700);
</script>
</body>
